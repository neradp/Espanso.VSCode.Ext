#
# CI: build, lint, test and package the extension on windows-latest
# (the user builds via CI, not locally — see AGENTS.md).

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Package VSIX
        run: npx @vscode/vsce package --out espanso-vscode-ext.vsix

      - uses: actions/upload-artifact@v7
        with:
          name: espanso-vscode-ext-vsix
          path: espanso-vscode-ext.vsix
