# Copyright (c) the Espanso.VSCode.Ext project contributors.
#
# Release: when a v* tag is pushed, build + test the extension, package the VSIX
# and attach it to a GitHub Release created for that tag.
#
# Usage:
#   1. Bump "version" in package.json (must match the tag, e.g. 0.1.0 -> v0.1.0).
#   2. git tag v0.1.0 && git push origin v0.1.0

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed by `gh release create` to publish the release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Fail early if the tag does not match package.json's version, so the
      # Marketplace/VSIX version never diverges from the git tag.
      - name: Verify tag matches package.json version
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) {
            Write-Error "Tag v$tag does not match package.json version $pkg"
          }

      - name: Package VSIX
        run: npx @vscode/vsce package --out "espanso-vscode-ext-${{ github.ref_name }}.vsix"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          "espanso-vscode-ext-${{ github.ref_name }}.vsix"
          --title "${{ github.ref_name }}"
          --generate-notes
